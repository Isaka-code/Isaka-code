<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-label="ねむっては起きる ねぼすけAI">
<title>ねぼすけAI</title>
<desc>ねむって、ときどき起きて、寝言を言って、また寝ます。</desc>

<style>
  /* 1サイクル 5.7秒（眠り1.8秒 + 起床3.9秒）× 4本 = 22.8秒でループ。寝言が4種類めぐる。 */
  .lbl   { font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif; }

  @keyframes breathe { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.02,.98)} }
  @keyframes hop     { 0%,31.6%{transform:translateY(0)} 37.9%{transform:translateY(-14px)}
                       44%{transform:translateY(0)} 50.2%{transform:translateY(-8px)}
                       57.5%,100%{transform:translateY(0)} }
  /* 眠り: 0〜1.8s / 起きている窓: 5.7秒中 1.8s〜5.7s */
  @keyframes awake   { 0%,31.6%{opacity:0} 36%{opacity:1} 93%{opacity:1} 100%{opacity:0} }
  @keyframes asleep  { 0%,31.6%{opacity:1} 36%{opacity:0} 93%{opacity:0} 100%{opacity:1} }
  @keyframes pop     { 0%,31.6%{opacity:0;transform:scale(.6)} 42.1%{opacity:1;transform:scale(1.06)}
                       46.5%{transform:scale(1)} 93%{opacity:1;transform:scale(1)}
                       100%{opacity:0;transform:scale(.7)} }
  @keyframes zfloat  { 0%{opacity:0;transform:translate(0,0) scale(.6)}
                       20%{opacity:.95} 100%{opacity:0;transform:translate(26px,-58px) scale(1.25)} }
  @keyframes glow    { 0%,100%{opacity:.3} 50%{opacity:.85} }
  @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.95} }

  /* 寝言の出し分け（22.8秒周期の4つの窓） */
  @keyframes p1 { 0%,8.8%{opacity:0}  9.7%{opacity:1} 23.2%{opacity:1} 25.0%{opacity:0} }
  @keyframes p2 { 0%,33.8%{opacity:0} 34.6%{opacity:1} 48.2%{opacity:1} 50.0%{opacity:0} }
  @keyframes p3 { 0%,58.8%{opacity:0} 59.6%{opacity:1} 73.2%{opacity:1} 75.0%{opacity:0} }
  @keyframes p4 { 0%,83.8%{opacity:0} 84.6%{opacity:1} 98.2%{opacity:1} 100%{opacity:0} }

  #rig    { animation:hop 5.7s ease-in-out infinite; }
  #chest  { animation:breathe 3.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 90%; }
  .eyeOpen, #blush { opacity:0; animation:awake 5.7s linear infinite; }
  .eyeShut         { animation:asleep 5.7s linear infinite; }
  #bulb            { animation:glow 3.4s ease-in-out infinite; }
  #bubble          { opacity:0; animation:pop 5.7s ease-out infinite; transform-box:fill-box; transform-origin:8% 90%; }
  .zzz             { opacity:0; animation:zfloat 3s linear infinite, asleep 5.7s linear infinite; }
  .say             { opacity:0; }
  /* 表示順は s2 → s3 → s4 → s1（p1 が最初の窓） */
  #s2{animation:p1 22.8s linear infinite} #s3{animation:p2 22.8s linear infinite}
  #s4{animation:p3 22.8s linear infinite} #s1{animation:p4 22.8s linear infinite}
  .star { animation:twinkle 3s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) { * { animation:none !important } .eyeShut{opacity:1} }
</style>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#3b2a6b"/>
    <stop offset="60%" stop-color="#241a48"/>
    <stop offset="100%" stop-color="#161033"/>
  </linearGradient>
  <clipPath id="card"><rect width="760" height="280" rx="26"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="760" height="280" fill="url(#sky)"/>

  <!-- 星 -->
  <g fill="#fff">
    <circle class="star" cx="60"  cy="40"  r="1.8" style="animation-delay:0s"/>
    <circle class="star" cx="150" cy="28"  r="1.3" style="animation-delay:.6s"/>
    <circle class="star" cx="300" cy="52"  r="1.6" style="animation-delay:1.2s"/>
    <circle class="star" cx="470" cy="34"  r="1.2" style="animation-delay:.3s"/>
    <circle class="star" cx="600" cy="60"  r="1.7" style="animation-delay:1.8s"/>
    <circle class="star" cx="705" cy="120" r="1.3" style="animation-delay:2.4s"/>
    <circle class="star" cx="40"  cy="150" r="1.4" style="animation-delay:1.5s"/>
    <circle class="star" cx="250" cy="230" r="1.2" style="animation-delay:.9s"/>
    <circle class="star" cx="660" cy="215" r="1.5" style="animation-delay:2.1s"/>
  </g>

  <!-- 月 -->
  <circle cx="694" cy="52" r="22" fill="#ffd45e" opacity=".92"/>
  <circle cx="684" cy="46" r="19" fill="#241a48" opacity=".95"/>

  <!-- キャラクター -->
  <g id="rig" transform="translate(58,42) scale(0.86)">
    <g id="chest">
      <line x1="120" y1="30" x2="120" y2="52" stroke="#8f7fd8" stroke-width="6" stroke-linecap="round"/>
      <circle id="bulb" cx="120" cy="24" r="11" fill="#ffd45e"/>

      <rect x="34" y="48" width="172" height="132" rx="42" fill="#fff6e5"/>

      <g id="blush">
        <ellipse cx="63"  cy="128" rx="15" ry="10" fill="#ff9aa2" opacity=".75"/>
        <ellipse cx="177" cy="128" rx="15" ry="10" fill="#ff9aa2" opacity=".75"/>
      </g>

      <rect x="60" y="70" width="120" height="76" rx="26" fill="#33285e"/>

      <g class="eyeShut" stroke="#9be7c4" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M84 108 q14 14 28 0"/>
        <path d="M128 108 q14 14 28 0"/>
      </g>

      <g class="eyeOpen">
        <circle cx="98"  cy="104" r="13" fill="#9be7c4"/>
        <circle cx="142" cy="104" r="13" fill="#9be7c4"/>
        <circle cx="102" cy="100" r="4.5" fill="#33285e"/>
        <circle cx="146" cy="100" r="4.5" fill="#33285e"/>
        <path d="M108 128 q12 12 24 0" stroke="#9be7c4" stroke-width="5" stroke-linecap="round" fill="none"/>
      </g>

      <path d="M28 158 q92 26 184 0 v16 q0 14 -14 14 H42 q-14 0 -14 -14 z" fill="#7a6bd6"/>
      <path d="M28 158 q92 26 184 0" stroke="#9c8ff0" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- zzz -->
  <g class="lbl" fill="#cbbdf5" font-weight="700">
    <text class="zzz" x="228" y="86" font-size="26" style="animation-delay:0s,0s">z</text>
    <text class="zzz" x="250" y="66" font-size="21" style="animation-delay:1s,0s">z</text>
    <text class="zzz" x="212" y="104" font-size="17" style="animation-delay:2s,0s">z</text>
  </g>

  <!-- ふきだし -->
  <g id="bubble">
    <path d="M292 74 h430 a22 22 0 0 1 22 22 v72 a22 22 0 0 1 -22 22 H330 l-24 26 v-26 h-14
             a22 22 0 0 1 -22 -22 V96 a22 22 0 0 1 22 -22 z" fill="#fff6e5"/>
    <g class="lbl" fill="#2b2450" font-size="25" font-weight="700" text-anchor="middle">
      <text class="say" id="s1" x="517" y="142">あと 5ふん……</text>
      <text class="say" id="s2" x="517">
        <tspan x="517" y="124">ゆめの なかで</tspan>
        <tspan x="517" y="158">きんメダル とった……</tspan>
      </text>
      <text class="say" id="s3" x="517" y="142">1たす1は…… おふとん……</text>
      <text class="say" id="s4" x="517">
        <tspan x="517" y="124">きみ が おこして くれた の</tspan>
        <tspan x="517" y="158">うれしい……</tspan>
      </text>
    </g>
  </g>
</g>
</svg>
